name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # weekly: catch Claude Code transcript format changes early

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  e2e:
    # the real Claude Code CLI against a local fake API: no account, no secrets, no network calls to Anthropic
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        claude-code: ['2.1.281', 'latest']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude-code }}
      - name: Point the tests at the installed Claude Code
        shell: bash
        run: echo "CLAUDE_BIN=$(npm root -g)/@anthropic-ai/claude-code/bin/claude.exe" >> "$GITHUB_ENV"
      - run: '"$CLAUDE_BIN" --version'
        shell: bash
      - run: npm run test:e2e
